name: Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: Build the web showcase
        working-directory: ui/web
        run: |
          npm ci
          node ../scripts/prepare.mjs
          npx tsc --noEmit
          npx vite build --base ./
          echo "style.stack-junkie.com" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
